name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify generated bundle
        run: |
          python -m portupy.bundle_web
          git diff --exit-code -- web/bundle_pt.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript files
        run: |
          node --check web/app.js
          node --check web/pyodide-worker.js
          node --check web/service-worker.js
          node --check web/bundle_pt.js
          node --check web/vendor/pyodide/v0.26.4/full/pyodide.js

      - name: Check whitespace errors
        run: git diff --check

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheel"

      - name: Verify packaged playground
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import zipfile

          wheel = glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "wheel", "*.whl"))[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "cli.py",
              "web/index.html",
              "web/vendor/pyodide/v0.26.4/full/pyodide.js",
              "web/vendor/pyodide/v0.26.4/full/pyodide.asm.wasm",
          }
          missing = sorted(required - names)
          if missing:
              sys.exit(f"Missing package files: {missing}")
          PY
