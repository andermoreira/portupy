[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portupy"
dynamic = ["version"]
description = "PortuPy: Python escrito em português, com CLI e playground WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Anderson Alves", email = "contatodeanderson@gmail.com" }
]
keywords = [
  "python",
  "portuguese",
  "portugues",
  "education",
  "transpiler",
  "teaching",
  "pyodide",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/andermoreira/transpylar"
Repository = "https://github.com/andermoreira/transpylar"
Issues = "https://github.com/andermoreira/transpylar/issues"

[project.scripts]
portupy = "cli:main"

[tool.setuptools]
include-package-data = true
py-modules = ["cli"]

[tool.setuptools.dynamic]
version = { attr = "portupy.__version__" }

[tool.setuptools.packages.find]
include = ["portupy*", "web"]

[tool.setuptools.package-data]
portupy = ["exemplos/*.ptpy"]
web = [
  "*.html",
  "*.css",
  "*.js",
  "vendor/pyodide/LICENSE.txt",
  "vendor/pyodide/manifest.json",
  "vendor/pyodide/v0.26.4/full/*.js",
  "vendor/pyodide/v0.26.4/full/*.json",
  "vendor/pyodide/v0.26.4/full/*.wasm",
  "vendor/pyodide/v0.26.4/full/*.zip",
]
